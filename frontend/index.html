<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- STAGING ONLY: asks Google not to list the site yet. REMOVE this line before launch. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Jean Claude Muhire | Lived Experience Advocate, Community Builder, Social Impact Leader</title>
    <meta data-rh="true"
      name="description"
      content="Leadership through lived experience. Jean Claude Muhire shares stories that foster belonging, strengthen connections, and inspire action for NGOs, hospitals and schools."
    />
    <!--
      The share card: what WhatsApp, LinkedIn, Facebook, X and email show when a link to the site
      is pasted. Those apps read only this file and do not run the site's code, so every page
      shares this one card until the pages are pre-rendered. The picture is public/og-image.jpg,
      made from tools/og-card.html. Keep these words in step with content/site.js.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Jean Claude Muhire" />
    <meta data-rh="true" property="og:title" content="Jean Claude Muhire | Leadership through lived experience" />
    <meta data-rh="true"
      property="og:description"
      content="Sharing stories that foster belonging, strengthen connections, and inspire action. For NGOs, hospitals and schools."
    />
    <meta property="og:url" content="https://jcmuhire.com/" />
    <meta property="og:image" content="https://jcmuhire.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Jean Claude Muhire beside the words: Leadership isn't something you learn. It's something you live." />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      document.documentElement.classList.add('js')
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
