<!doctype html>
<!--
  The owner's editor. Opens at https://jcmuhire.com/admin/

  It is Decap CMS (decapcms.org, open source, formerly Netlify CMS). It runs entirely in the
  browser: after signing in with GitHub it reads the content files in src/content/data/ and
  saves changes back to the GitHub repository as commits. Cloudflare then rebuilds the site.

  The version below is pinned on purpose, so a new release can never change or break the editor
  without us choosing to upgrade. To upgrade: change the number, test locally (see
  OWNER_EDITOR.md), then push.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Edit the site | Jean Claude Muhire</title>
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@3.17.3/dist/decap-cms.js"></script>
  </body>
</html>
